<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体育教师工作台 - 离线资源库</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sports-meet.css">
</head>
<body>
  <div id="app"></div>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/unit-model.js"></script>
  <script src="js/unit-catalog.js"></script>
  <script src="js/unit-template.js"></script>
  <script src="js/offline-resources.js"></script>
  <script>
    // 页面装配放在这里（而不是 offline-resources.js 里）：
    // 那个文件同时被大单元设计页加载，在那里调 Layout.init 会把大单元页面洗掉。
    Layout.init('offline-resources', '离线资源库', '教学管理');
    Store.onReady(() => OfflineResources.renderPage());
  </script>
</body>
</html>
